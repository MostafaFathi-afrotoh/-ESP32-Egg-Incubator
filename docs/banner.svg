<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="45%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9966"/>
      <stop offset="100%" stop-color="#ff5e62"/>
    </linearGradient>
    <radialGradient id="egg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="100%" stop-color="#f0d9b5"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- circuit-trace texture -->
  <g stroke="#3d6b7d" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M0 40 H160 L190 70 H340"/>
    <path d="M0 210 H120 L150 180 H300 L330 210 H500"/>
    <path d="M1200 60 H1030 L1000 90 H860"/>
    <path d="M1200 200 H1080 L1050 170 H900 L870 200 H760"/>
    <circle cx="190" cy="70" r="4" fill="#3d6b7d"/>
    <circle cx="340" cy="70" r="4" fill="#3d6b7d"/>
    <circle cx="1000" cy="90" r="4" fill="#3d6b7d"/>
    <circle cx="150" cy="180" r="4" fill="#3d6b7d"/>
  </g>

  <!-- egg icon -->
  <g transform="translate(120,130)">
    <ellipse cx="0" cy="0" rx="58" ry="74" fill="url(#egg)" stroke="#d8b98a" stroke-width="2"/>
    <path d="M -30 -10 Q 0 -55 30 -10" stroke="#ff5e62" stroke-width="3" fill="none" opacity="0.55"/>
    <path d="M -34 20 Q 0 -20 34 20" stroke="#2c5364" stroke-width="2" fill="none" opacity="0.35"/>
    <!-- thermometer overlay -->
    <rect x="-6" y="-40" width="12" height="60" rx="6" fill="#ffffff" stroke="#ff5e62" stroke-width="2"/>
    <circle cx="0" cy="26" r="12" fill="url(#warm)"/>
    <rect x="-3.5" y="-30" width="7" height="50" fill="url(#warm)"/>
  </g>

  <!-- title block -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="230" y="105" font-size="42" font-weight="700" fill="#ffffff">ESP32 Egg Incubator Controller</text>
    <text x="230" y="140" font-size="19" fill="#a9c6d1">Safety-critical, offline-first firmware for automated egg incubation</text>

    <!-- badges -->
    <g font-size="14" fill="#0f2027" font-weight="600">
      <rect x="230" y="165" width="118" height="30" rx="15" fill="#4ec9f5"/>
      <text x="252" y="185">ESP32</text>

      <rect x="358" y="165" width="150" height="30" rx="15" fill="#ffb74d"/>
      <text x="378" y="185">Hysteresis Control</text>

      <rect x="518" y="165" width="150" height="30" rx="15" fill="#81c784"/>
      <text x="538" y="185">Predictive Fallback</text>

      <rect x="678" y="165" width="150" height="30" rx="15" fill="#ff8a80"/>
      <text x="700" y="185">Multi-Layer Safety</text>

      <rect x="838" y="165" width="170" height="30" rx="15" fill="#ce93d8"/>
      <text x="858" y="185">Dual-Blob NVS</text>
    </g>
  </g>
</svg>
