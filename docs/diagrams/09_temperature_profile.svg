<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <!-- خلفية -->
  <rect width="900" height="600" fill="#ffffff" stroke="#2c3e50" stroke-width="2" rx="10"/>

  <!-- العنوان -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">Temperature Profile – 24‑Hour Cycle</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#7f8c8d">Heater ON/OFF vs. Incubator Temperature (simulated)</text>
  <line x1="50" y1="75" x2="850" y2="75" stroke="#bdc3c7" stroke-width="1.5"/>

  <!-- منطقة الرسم -->
  <rect x="80" y="100" width="740" height="400" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1"/>

  <!-- خطوط الشبكة الأفقية -->
  <line x1="80" y1="120" x2="820" y2="120" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="80" y1="160" x2="820" y2="160" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="80" y1="200" x2="820" y2="200" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="80" y1="240" x2="820" y2="240" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="80" y1="280" x2="820" y2="280" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="80" y1="320" x2="820" y2="320" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="80" y1="360" x2="820" y2="360" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="80" y1="400" x2="820" y2="400" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="80" y1="440" x2="820" y2="440" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="80" y1="480" x2="820" y2="480" stroke="#ecf0f1" stroke-width="1"/>

  <!-- تسميات المحور Y (درجة الحرارة) -->
  <text x="70" y="125" text-anchor="end" font-size="10" fill="#2c3e50">42°C</text>
  <text x="70" y="165" text-anchor="end" font-size="10" fill="#2c3e50">40°C</text>
  <text x="70" y="205" text-anchor="end" font-size="10" fill="#2c3e50">38°C</text>
  <text x="70" y="245" text-anchor="end" font-size="10" fill="#2c3e50">36°C</text>
  <text x="70" y="285" text-anchor="end" font-size="10" fill="#2c3e50">34°C</text>
  <text x="70" y="325" text-anchor="end" font-size="10" fill="#2c3e50">32°C</text>
  <text x="70" y="365" text-anchor="end" font-size="10" fill="#2c3e50">30°C</text>

  <!-- خطوط الشبكة الرأسية (كل ساعتين) -->
  <line x1="130" y1="100" x2="130" y2="500" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="200" y1="100" x2="200" y2="500" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="270" y1="100" x2="270" y2="500" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="340" y1="100" x2="340" y2="500" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="410" y1="100" x2="410" y2="500" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="480" y1="100" x2="480" y2="500" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="550" y1="100" x2="550" y2="500" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="620" y1="100" x2="620" y2="500" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="690" y1="100" x2="690" y2="500" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="760" y1="100" x2="760" y2="500" stroke="#ecf0f1" stroke-width="1"/>

  <!-- تسميات المحور X (الوقت) -->
  <text x="105" y="520" text-anchor="middle" font-size="9" fill="#2c3e50">00:00</text>
  <text x="200" y="520" text-anchor="middle" font-size="9" fill="#2c3e50">02:00</text>
  <text x="310" y="520" text-anchor="middle" font-size="9" fill="#2c3e50">06:00</text>
  <text x="410" y="520" text-anchor="middle" font-size="9" fill="#2c3e50">10:00</text>
  <text x="500" y="520" text-anchor="middle" font-size="9" fill="#2c3e50">14:00</text>
  <text x="600" y="520" text-anchor="middle" font-size="9" fill="#2c3e50">18:00</text>
  <text x="700" y="520" text-anchor="middle" font-size="9" fill="#2c3e50">22:00</text>

  <!-- منحنى درجة الحرارة -->
  <!-- نقاط المحاكاة: (x, y) حيث y = 500 - ((temp - 20) / 22 * 400) -->
  <!-- 00:00 34°C → y=255 -->
  <!-- 02:00 37°C → y=191 -->
  <!-- 04:00 37.5°C → y=182 -->
  <!-- 06:00 37.7°C → y=178 -->
  <!-- 08:00 38.2°C → y=169 -->
  <!-- 10:00 39.5°C → y=145 -->
  <!-- 12:00 39.8°C → y=140 -->
  <!-- 14:00 38.5°C → y=164 -->
  <!-- 16:00 37.8°C → y=176 -->
  <!-- 18:00 37.5°C → y=182 -->
  <!-- 20:00 37.2°C → y=189 -->
  <!-- 22:00 36.8°C → y=196 -->
  <!-- 24:00 35.5°C → y=218 -->

  <path d="M105,255 
           L130,255 L155,230 L180,210 L205,200 
           L230,191 L255,185 L280,180 L305,178 
           L330,182 L355,180 L380,169 L405,160 
           L430,155 L455,145 L480,140 L505,145 
           L530,155 L555,164 L580,176 L605,182 
           L630,189 L655,191 L680,196 L705,205 
           L730,210 L755,218 L780,230 L805,245 L830,255"
        fill="none" stroke="#e74c3c" stroke-width="3"/>

  <!-- منطقة الاستقرار المثالية (37.2-37.8°C) -->
  <rect x="80" y="182" width="740" height="30" fill="#2ecc71" fill-opacity="0.2" stroke="none"/>
  <text x="90" y="200" font-size="10" fill="#27ae60">Ideal Range (37.2-37.8°C)</text>

  <!-- خط الطوارئ (39.8°C) -->
  <line x1="80" y1="140" x2="820" y2="140" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="830" y="143" font-size="10" fill="#e74c3c">Emergency 39.8°C</text>

  <!-- حالات السخان (ON/OFF) -->
  <!-- فترة التشغيل الأولى (00:00 - 02:00) -->
  <rect x="105" y="480" width="50" height="15" fill="#f39c12" rx="3"/>
  <!-- فترة التشغيل الثانية (04:00 - 08:00) -->
  <rect x="180" y="480" width="100" height="15" fill="#f39c12" rx="3"/>
  <!-- فترة التشغيل الثالثة (10:00 - 11:00) -->
  <rect x="310" y="480" width="40" height="15" fill="#f39c12" rx="3"/>
  <!-- فترة التشغيل الرابعة (14:00 - 18:00) -->
  <rect x="410" y="480" width="160" height="15" fill="#f39c12" rx="3"/>
  <!-- فترة التشغيل الخامسة (20:00 - 22:00) -->
  <rect x="550" y="480" width="80" height="15" fill="#f39c12" rx="3"/>
  <!-- فترة التشغيل السادسة (23:30 - 24:00) -->
  <rect x="655" y="480" width="40" height="15" fill="#f39c12" rx="3"/>

  <text x="90" y="490" font-size="9" fill="#2c3e50">Heater: ON (yellow bar)</text>

  <!-- الأسطورة -->
  <rect x="50" y="540" width="800" height="45" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="60" y="560" font-size="11" fill="#2c3e50">📌 Legend:</text>
  <line x1="150" y1="557" x2="190" y2="557" stroke="#e74c3c" stroke-width="3"/>
  <text x="195" y="562" font-size="10" fill="#2c3e50">Temperature</text>
  <rect x="300" y="550" width="20" height="12" fill="#f39c12" rx="3"/>
  <text x="325" y="562" font-size="10" fill="#2c3e50">Heater ON</text>
  <rect x="440" y="550" width="20" height="12" fill="#2ecc71" fill-opacity="0.3" rx="3"/>
  <text x="465" y="562" font-size="10" fill="#2c3e50">Ideal Range</text>
  <line x1="580" y1="557" x2="620" y2="557" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="625" y="562" font-size="10" fill="#2c3e50">Emergency Cutoff</text>
</svg>