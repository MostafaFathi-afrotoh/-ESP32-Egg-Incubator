<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780">
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; fill: #1a1a2e; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #555; }
      .box-label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: bold; fill: #fff; text-anchor: middle; }
      .box-sub { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #f0f0f0; text-anchor: middle; }
      .arrow-label { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #333; }
      .legend { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #222; }
      .footer { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #666; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="780" fill="#f8f9fa"/>
  <rect x="20" y="20" width="1060" height="740" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>

  <!-- Title -->
  <text x="550" y="52" class="title" text-anchor="middle">ESP32 Egg Incubator — System Block Diagram</text>
  <text x="550" y="72" class="subtitle" text-anchor="middle">v2.0 · Offline-first control · Memory10_2.ino</text>

  <!-- ========== SENSORS (left) ========== -->
  <rect x="50" y="110" width="160" height="200" rx="10" fill="#3498db" filter="url(#shadow)"/>
  <text x="130" y="140" class="box-label">SENSORS</text>
  <text x="130" y="165" class="box-sub">DS18B20 ×2 (GPIO 4)</text>
  <text x="130" y="182" class="box-sub">OneWire + 4.7kΩ</text>
  <text x="130" y="210" class="box-sub">DHT22 (GPIO 15)</text>
  <text x="130" y="227" class="box-sub">Humidity + backup T</text>
  <text x="130" y="255" class="box-sub">LCD 16×2 I²C 0x27</text>
  <text x="130" y="272" class="box-sub">SDA/SCL</text>
  <text x="130" y="295" class="box-sub">LED Fail (GPIO 5)</text>

  <!-- ========== CORE ========== -->
  <rect x="320" y="100" width="220" height="220" rx="12" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="430" y="135" class="box-label">ESP32 CORE</text>
  <text x="430" y="160" class="box-sub">Arduino Framework</text>
  <text x="430" y="185" class="box-sub">Hysteresis Control</text>
  <text x="430" y="205" class="box-sub">Safe / Emergency</text>
  <text x="430" y="225" class="box-sub">WDT 8 s · NVS Dual-blob</text>
  <text x="430" y="245" class="box-sub">Diagnostics · Health Score</text>
  <text x="430" y="265" class="box-sub">Predictive Model</text>
  <text x="430" y="285" class="box-sub">Cycle Archive</text>
  <text x="430" y="305" class="box-sub">Serial Commands</text>

  <!-- ========== ACTUATORS ========== -->
  <rect x="650" y="110" width="170" height="200" rx="10" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="735" y="140" class="box-label">ACTUATORS</text>
  <text x="735" y="170" class="box-sub">🔥 Heater GPIO 27</text>
  <text x="735" y="195" class="box-sub">🌀 Fan GPIO 13</text>
  <text x="735" y="220" class="box-sub">🔄 Turner GPIO 14</text>
  <text x="735" y="245" class="box-sub">💧 Evaporator GPIO 12</text>
  <text x="735" y="275" class="box-sub">via Relays</text>
  <text x="735" y="292" class="box-sub">(optocoupled)</text>

  <!-- ========== CLOUD ========== -->
  <rect x="870" y="110" width="180" height="200" rx="10" fill="#9b59b6" filter="url(#shadow)"/>
  <text x="960" y="140" class="box-label">CLOUD (optional)</text>
  <text x="960" y="170" class="box-sub">WiFi STA</text>
  <text x="960" y="195" class="box-sub">Adafruit IO HTTP</text>
  <text x="960" y="220" class="box-sub">Telegram Bot</text>
  <text x="960" y="245" class="box-sub">Email (off default)</text>
  <text x="960" y="275" class="box-sub">Exp. backoff</text>
  <text x="960" y="292" class="box-sub">Never blocks control</text>

  <!-- ========== STORAGE ========== -->
  <rect x="320" y="360" width="220" height="90" rx="10" fill="#16a085" filter="url(#shadow)"/>
  <text x="430" y="395" class="box-label">NVS STORAGE</text>
  <text x="430" y="420" class="box-sub">Dual-blob CRC16 · Cycle archive</text>
  <text x="430" y="437" class="box-sub">Timer · Safe/Emergency flags</text>

  <!-- ========== POWER ========== -->
  <rect x="50" y="360" width="160" height="90" rx="10" fill="#f39c12" filter="url(#shadow)"/>
  <text x="130" y="395" class="box-label">POWER</text>
  <text x="130" y="420" class="box-sub">5V / 12V loads</text>
  <text x="130" y="437" class="box-sub">3.3V ESP32 rail</text>

  <!-- ========== SAFETY ========== -->
  <rect x="650" y="360" width="170" height="90" rx="10" fill="#c0392b" filter="url(#shadow)"/>
  <text x="735" y="395" class="box-label">SAFETY LAYER</text>
  <text x="735" y="420" class="box-sub">39.8°C Emergency</text>
  <text x="735" y="437" class="box-sub">Relay stuck · Safe Mode</text>

  <!-- Arrows: Sensors → Core -->
  <line x1="210" y1="210" x2="318" y2="210" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="255" y="200" class="arrow-label">temp / hum</text>

  <!-- Core → Actuators -->
  <line x1="540" y1="200" x2="648" y2="200" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="575" y="190" class="arrow-label">GPIO drive</text>

  <!-- Core → Cloud -->
  <line x1="540" y1="160" x2="868" y2="160" stroke="#9b59b6" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <text x="680" y="150" class="arrow-label" fill="#9b59b6">telemetry (optional)</text>

  <!-- Core → NVS -->
  <line x1="430" y1="320" x2="430" y2="358" stroke="#16a085" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="445" y="345" class="arrow-label">persist</text>

  <!-- Power → Core -->
  <line x1="210" y1="405" x2="318" y2="405" stroke="#f39c12" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Core → Safety (conceptual) -->
  <line x1="540" y1="280" x2="648" y2="380" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="50" y="490" width="1000" height="100" rx="8" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="70" y="515" class="legend" font-weight="bold">LEGEND</text>
  <rect x="70" y="530" width="18" height="14" rx="3" fill="#3498db"/>
  <text x="95" y="542" class="legend">Inputs / Sensors</text>
  <rect x="220" y="530" width="18" height="14" rx="3" fill="#2c3e50"/>
  <text x="245" y="542" class="legend">Processing (ESP32)</text>
  <rect x="400" y="530" width="18" height="14" rx="3" fill="#e74c3c"/>
  <text x="425" y="542" class="legend">Outputs / Actuators</text>
  <rect x="580" y="530" width="18" height="14" rx="3" fill="#9b59b6"/>
  <text x="605" y="542" class="legend">Cloud (non-critical)</text>
  <rect x="770" y="530" width="18" height="14" rx="3" fill="#16a085"/>
  <text x="795" y="542" class="legend">Storage</text>
  <rect x="70" y="555" width="18" height="14" rx="3" fill="#f39c12"/>
  <text x="95" y="567" class="legend">Power</text>
  <rect x="220" y="555" width="18" height="14" rx="3" fill="#c0392b"/>
  <text x="245" y="567" class="legend">Safety</text>
  <line x1="400" y1="562" x2="430" y2="562" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="566" class="legend">Solid = control path</text>
  <line x1="600" y1="562" x2="630" y2="562" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="640" y="566" class="legend">Dashed = optional / observational</text>

  <!-- Design principle -->
  <rect x="50" y="610" width="1000" height="50" rx="6" fill="#eafaf1" stroke="#27ae60"/>
  <text x="550" y="632" class="legend" text-anchor="middle" font-weight="bold" fill="#1e8449">Design principle: Network is OPTIONAL — heater, safety, and diagnostics always run offline.</text>
  <text x="550" y="650" class="legend" text-anchor="middle" fill="#1e8449">Cloud / Telegram / Email never block the control loop (WDT-safe timeouts).</text>

  <text x="550" y="740" class="footer" text-anchor="middle">ESP32 Egg Incubator Controller v2.0 · System Block Diagram · For documentation &amp; manufacturing</text>
</svg>
