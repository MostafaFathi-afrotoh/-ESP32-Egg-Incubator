<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <defs>
    <style>
      .t { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1a1a2e; }
      .s { font-family: Arial, sans-serif; font-size: 11px; fill: #555; }
      .l { font-family: Arial, sans-serif; font-size: 11px; fill: #222; }
      .d { font-family: Arial, sans-serif; font-size: 10px; fill: #c0392b; font-weight: bold; }
    </style>
  </defs>
  <rect width="1000" height="720" fill="#f8f9fa"/>
  <rect x="15" y="15" width="970" height="690" rx="6" fill="#fff" stroke="#ced4da"/>

  <text x="500" y="42" class="t" text-anchor="middle">ESP32 Egg Incubator — Enclosure Concept</text>
  <text x="500" y="60" class="s" text-anchor="middle">Example dimensions · ABS or aluminum · Ventilation required near relays / PSU</text>

  <!-- Front view -->
  <text x="200" y="95" class="l" font-weight="bold">FRONT VIEW</text>
  <rect x="60" y="110" width="280" height="180" rx="6" fill="#d5dbdb" stroke="#566573" stroke-width="2"/>
  <!-- LCD window -->
  <rect x="100" y="140" width="120" height="40" rx="2" fill="#1c2833" stroke="#111"/>
  <text x="160" y="165" fill="#2ecc71" font-family="monospace" font-size="10" text-anchor="middle">LCD 16x2</text>
  <!-- LED -->
  <circle cx="260" cy="155" r="8" fill="#e74c3c" stroke="#922b21"/>
  <text x="260" y="180" class="l" text-anchor="middle" font-size="9">Fail LED</text>
  <!-- USB -->
  <rect x="100" y="250" width="40" height="12" fill="#2c3e50"/>
  <text x="120" y="278" class="l" text-anchor="middle" font-size="9">USB</text>
  <!-- vents -->
  <line x1="250" y1="230" x2="310" y2="230" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="250" y1="240" x2="310" y2="240" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="250" y1="250" x2="310" y2="250" stroke="#7f8c8d" stroke-width="2"/>
  <text x="280" y="278" class="l" text-anchor="middle" font-size="9">vents</text>
  <text x="200" y="310" class="d" text-anchor="middle">~160 mm width (example)</text>

  <!-- Top view -->
  <text x="600" y="95" class="l" font-weight="bold">TOP VIEW</text>
  <rect x="450" y="110" width="280" height="160" rx="6" fill="#aeb6bf" stroke="#566573" stroke-width="2"/>
  <rect x="480" y="140" width="80" height="50" rx="3" fill="#2c3e50"/>
  <text x="520" y="170" fill="#fff" font-size="9" text-anchor="middle">ESP32</text>
  <rect x="580" y="140" width="60" height="40" rx="3" fill="#c0392b"/>
  <text x="610" y="165" fill="#fff" font-size="9" text-anchor="middle">Relays</text>
  <rect x="480" y="210" width="100" height="30" rx="3" fill="#f39c12"/>
  <text x="530" y="230" fill="#fff" font-size="9" text-anchor="middle">PSU area</text>
  <text x="590" y="290" class="d" text-anchor="middle">~90 mm depth</text>

  <!-- Side dims -->
  <text x="60" y="340" class="d">Height example ~60 mm</text>

  <!-- Notes -->
  <rect x="60" y="370" width="880" height="200" rx="6" fill="#eaf2f8" stroke="#5dade2"/>
  <text x="80" y="400" class="l" font-weight="bold">Mechanical notes</text>
  <text x="80" y="425" class="l">• Material: ABS (3D print) or aluminum for better heat dissipation near relays.</text>
  <text x="80" y="445" class="l">• Mount LCD flush on front; seal edges if humid environment.</text>
  <text x="80" y="465" class="l">• Provide cable glands for heater/fan/turner wires; strain relief mandatory.</text>
  <text x="80" y="485" class="l">• Keep sensor probes outside enclosure in the incubation chamber airflow.</text>
  <text x="80" y="505" class="l">• USB accessible without opening chassis for firmware updates.</text>
  <text x="80" y="525" class="l">• Ventilation: intake low, exhaust high near heat sources; avoid moisture into PCB.</text>
  <text x="80" y="545" class="l">• Label exterior: “Heater live”, “12V”, safety warnings if mains used.</text>

  <text x="500" y="680" class="s" text-anchor="middle">ESP32 Egg Incubator v2.0 · Enclosure concept (not manufacturing drawings)</text>
</svg>
